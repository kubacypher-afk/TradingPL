workflows:
  build-unsigned-ios:
    name: Build Binance Radar .IPA & Simulator
    max_build_duration: 15
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
    scripts:
      - name: Build iOS App for Physical Devices (ARM64)
        script: |
          xcodebuild build \
            -project "BinanceRadar.xcodeproj" \
            -scheme "BinanceRadar" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into unsigned .ipa (for Sideloadly & iPhone)
        script: |
          mkdir Payload
          cp -r $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/*.app Payload/
          zip -r BinanceRadar.ipa Payload
          rm -rf Payload

      - name: Build iOS Simulator App (for Appetize.io Browser Emulator)
        script: |
          xcodebuild build \
            -project "BinanceRadar.xcodeproj" \
            -scheme "BinanceRadar" \
            -sdk iphonesimulator \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          cd $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphonesimulator
          zip -r $CM_BUILD_DIR/BinanceRadar-Simulator.zip BinanceRadar.app

    artifacts:
      - BinanceRadar.ipa
      - BinanceRadar-Simulator.zip
