workflows:
  build-unsigned-ios:
    name: Build Binance Radar .IPA & Simulator
    max_build_duration: 15
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
    scripts:
      - name: Build iOS App for Physical Devices (ARM64)
        script: |
          xcodebuild build \
            -project "BinanceRadar.xcodeproj" \
            -scheme "BinanceRadar" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into unsigned .ipa (for Sideloadly & Physical iPhone)
        script: |
          mkdir -p Payload
          DEVICE_APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "BinanceRadar.app" -path "*/Release-iphoneos/*" | head -n 1)
          echo "Found device app at: $DEVICE_APP_PATH"
          cp logo.jpg "$DEVICE_APP_PATH/logo.jpg"
          cp -r "$DEVICE_APP_PATH" Payload/
          zip -r BinanceRadar.ipa Payload
          rm -rf Payload

      - name: Build iOS Simulator App (for Appetize.io Browser Emulator)
        script: |
          xcodebuild build \
            -project "BinanceRadar.xcodeproj" \
            -scheme "BinanceRadar" \
            -sdk iphonesimulator \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          SIM_APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "BinanceRadar.app" -path "*/Release-iphonesimulator/*" | head -n 1)
          echo "Found simulator app at: $SIM_APP_PATH"
          cp logo.jpg "$SIM_APP_PATH/logo.jpg"
          cd "$(dirname "$SIM_APP_PATH")"
          zip -r "$CM_BUILD_DIR/BinanceRadar-Simulator.zip" BinanceRadar.app

    artifacts:
      - BinanceRadar.ipa
      - BinanceRadar-Simulator.zip
